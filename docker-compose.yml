name: capstone-malaria

services:
  db:
    image: postgres:17.9
    container_name: capstone_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    container_name: capstone_backend
    restart: always
    platform: linux/amd64
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # SWV2.1: the backend runs as the certified non-superuser runtime role. POSTGRES_USER is the
      # local admin/DBeaver login and is blanked here so the runtime container never carries it.
      DATABASE_URL: postgresql+psycopg://capstone_v2_runtime:${CAPSTONE_V2_RUNTIME_PASSWORD:?CAPSTONE_V2_RUNTIME_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
      STORAGE_PROVIDER: local
      STORAGE_ROOT: /app/var/storage
    volumes:
      - scientific_storage:/app/var/storage
      - ./backups:/app/backups:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: capstone_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  # SWV2.0: PostgreSQL v2 certified cluster (sysid 7691366089693499436, GATE DB-V2).
  # Pre-existing volume, never created, initialized or removed by Compose.
  postgres_data:
    external: true
    name: capstone_v2_isolated_persistent_data
  scientific_storage:
