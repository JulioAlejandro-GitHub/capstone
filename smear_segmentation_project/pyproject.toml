[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smear-segmentation-project"
version = "0.1.0"
description = "Entrenamiento y evaluación de segmentación/detección celular en frotis completos"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
runtime = ["ultralytics>=8.4,<9", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
