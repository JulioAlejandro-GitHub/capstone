name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
      - run: python scripts/check_docker_postgres_contract.py
      - run: test -f .env.example && test -f docs/engineering/configuration.md
  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r backend_api/requirements.txt
      - run: PYTHONPATH=backend_api pytest backend_api/tests -m "not requires_docker_postgres"
        env:
          APP_ENV: development
          DATABASE_URL: postgresql://unused:unused@db:5432/capstone
          JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
  alembic-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r backend_api/requirements.txt
      - run: PYTHONPATH=backend_api python -m compileall -q alembic backend_api scripts/db
      - name: Validate linear Alembic history
        run: python scripts/db/check_alembic_linearity.py
      - run: PYTHONPATH=backend_api pytest backend_api/tests/test_check_alembic_linearity.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  ml-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r malaria_dl_local_project/requirements.txt
      - run: PYTHONPATH=malaria_dl_local_project python -m pytest malaria_dl_local_project/tests/test_label_mapping.py malaria_dl_local_project/tests/test_decision.py malaria_dl_local_project/tests/test_image_quality.py
