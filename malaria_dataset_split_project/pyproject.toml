[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malaria-dataset-split-project"
version = "0.1.0"
description = "Auditoría y gobierno reproducible del dataset de malaria"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
malaria-split = "malaria_split.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
