services:
  backend:
    environment:
      MALARIA_DL_PROJECT_ROOT: /app/malaria_dl_local_project
      # TEMPORAL: sólo para el intento controlado local_python autorizado el 2026-09-15
      # contra la campaña 3acf89b7. Revertir (quitar estas 2 líneas + el volumen de abajo)
      # cuando ese intento termine -- `git diff docker-compose.override.yml` muestra el bloque exacto.
      CAPSTONE_LOCAL_EXECUTION_ENABLED: "1"
      CAPSTONE_LOCAL_STORAGE_ROOTS: >-
        {"dataset":"/app/malaria_dl_local_project/data/malaria_dataset_versions/d8c0cab5-09dd-597f-9de7-7ca01aee2ec2",
        "artifacts":"/app/var/local_artifacts"}
    volumes:
      - ./backend_api/app:/app/app
      - ./backend_api/tests:/app/tests
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./pytest.ini:/app/pytest.ini:ro
      # Montamos explícitamente el proyecto ML requerido por los imports `src.*`.
      - ./malaria_dl_local_project:/app/malaria_dl_local_project:ro
      # Los releases son artefactos runtime inmutables creados al publicar.
      # Este bind más específico mantiene el código en modo read-only y
      # habilita escritura únicamente en el directorio gobernado de releases.
      - ./malaria_dl_local_project/releases:/app/malaria_dl_local_project/releases
      - ./malaria_dataset_split_project/src:/app/malaria_dataset_split_project/src:ro
      # TEMPORAL: raíz de artefactos compartida Mac<->backend para el intento local_python
      # (el backend necesita leer el checkpoint real para verify_session/load_checkpoint).
      - ./malaria_dl_local_project/local_execution_artifacts:/app/var/local_artifacts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    # Ignoramos el Dockerfile (Nginx) y usamos Node puro temporalmente
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    # Forzamos a que instale dependencias y corra en el puerto 80 para coincidir con Nginx
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
  db:
    ports:
      - "5432:5432"
